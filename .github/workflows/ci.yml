name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  # awslabs/aws-encryption-sdk-test-vectors is fetched at this one commit
  # (b6a6c91e62cc67f891b5dc3d11b0f047d10baf76), never at its default
  # branch, and the test-vectors cache is keyed on it with no fallback key,
  # so a cache never restores a clone of another commit. release.yml pins
  # the same commit; move both together.
  TEST_VECTORS_SHA: b6a6c91e62cc67f891b5dc3d11b0f047d10baf76

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

  quality:
    name: Quality (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    needs: compile
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      KMS_KEY_ARN: ${{ secrets.KMS_KEY_ARN }}
      AWS_REGION: us-east-1

    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported
          - elixir: "1.16"
            otp: "26"
          # Middle ground
          - elixir: "1.17"
            otp: "26"
          # Newest Elixir on the oldest supported OTP
          - elixir: "1.18"
            otp: "26"
          # Latest (with coverage upload)
          - elixir: "1.18"
            otp: "27"
            coverage: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-
            deps-${{ runner.os }}-

      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: _build
          key: build-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            build-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Cache PLT
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Cache test vectors
        uses: actions/cache@v4
        with:
          path: test/fixtures/test_vectors
          key: test-vectors-${{ env.TEST_VECTORS_SHA }}

      - name: Setup test vectors
        run: |
          dir=test/fixtures/test_vectors
          if [ "$(git -C "$dir" rev-parse HEAD 2>/dev/null || true)" != "$TEST_VECTORS_SHA" ]; then
            rm -rf "$dir"
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 https://github.com/awslabs/aws-encryption-sdk-test-vectors.git "$TEST_VECTORS_SHA"
            git -C "$dir" checkout -q FETCH_HEAD
            cd "$dir/vectors/awses-decrypt"
            unzip -q python-2.3.0.zip
          fi

      - name: Run quality checks
        run: mix quality

      - name: Generate coverage report
        if: matrix.coverage
        run: mix coveralls.json

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v4
        with:
          files: cover/excoveralls.json
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  no-aws-deps:
    name: Raw keyrings without AWS deps
    runs-on: ubuntu-latest
    env:
      # Drops the optional ex_aws/ex_aws_kms/hackney/sweet_xml stack from
      # deps entirely, proving the raw-keyring path stands alone. See
      # aws_kms_deps/0 in mix.exs.
      NO_AWS_DEPS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile without AWS deps
        run: mix compile --warnings-as-errors

      - name: Cache test vectors
        uses: actions/cache@v4
        with:
          path: test/fixtures/test_vectors
          key: test-vectors-${{ env.TEST_VECTORS_SHA }}

      - name: Setup test vectors
        run: |
          dir=test/fixtures/test_vectors
          if [ "$(git -C "$dir" rev-parse HEAD 2>/dev/null || true)" != "$TEST_VECTORS_SHA" ]; then
            rm -rf "$dir"
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 https://github.com/awslabs/aws-encryption-sdk-test-vectors.git "$TEST_VECTORS_SHA"
            git -C "$dir" checkout -q FETCH_HEAD
            cd "$dir/vectors/awses-decrypt"
            unzip -q python-2.3.0.zip
          fi

      - name: Run tests without AWS deps
        run: mix test

  hackney-1x:
    name: Host on hackney 1.x (Elixir 1.18 / OTP 26)
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      KMS_KEY_ARN: ${{ secrets.KMS_KEY_ARN }}
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "26"

      # A host already on hackney 1.x (through httpoison) resolves the
      # SDK with no committed lock, the way a real host would.
      - name: Resolve the hackney 1.x host
        working-directory: test/fixtures/hackney1_host
        run: mix deps.get

      - name: Compile the hackney 1.x host
        working-directory: test/fixtures/hackney1_host
        run: mix compile --warnings-as-errors

      - name: Show the host's resolved hackney and ex_aws
        working-directory: test/fixtures/hackney1_host
        run: grep -E '^  "(hackney|ex_aws)":' mix.lock | cut -d, -f1-3

      # The SDK's own suite on the same pair. Three of hackney's
      # dependencies are locked at versions hackney 1.x refuses, so they
      # are unlocked with it: parse_trans (1.x pins exactly 3.4.1), idna
      # (1.x wants ~> 6.1.0) and certifi (1.x wants ~> 2.15.0). The locked
      # mimerl and ssl_verify_fun already satisfy 1.x and stay as locked;
      # packages only 1.x needs are added by deps.get. See aws_kms_deps/0
      # in mix.exs.
      - name: Unlock the hackney stack
        run: HACKNEY_1X=1 mix deps.unlock hackney ex_aws parse_trans idna certifi

      - name: Install dependencies on hackney 1.x
        run: |
          HACKNEY_1X=1 mix deps.get
          grep -E '^  "(hackney|ex_aws)":' mix.lock | cut -d, -f1-3

      - name: Compile on hackney 1.x
        run: HACKNEY_1X=1 MIX_ENV=test mix compile --warnings-as-errors

      # KMS integration tests run when the secrets are present; the
      # integration gate excludes them otherwise and says so in the log.
      - name: Run tests on hackney 1.x
        run: HACKNEY_1X=1 mix test --exclude test_vectors
