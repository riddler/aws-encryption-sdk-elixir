name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  # awslabs/aws-encryption-sdk-test-vectors is fetched at this one commit
  # (b6a6c91e62cc67f891b5dc3d11b0f047d10baf76), never at its default
  # branch, and the test-vectors cache is keyed on it with no fallback key,
  # so a cache never restores a clone of another commit. release.yml pins
  # the same commit; move both together.
  TEST_VECTORS_SHA: b6a6c91e62cc67f891b5dc3d11b0f047d10baf76

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

  quality:
    name: Quality (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    needs: compile
    runs-on: ubuntu-latest

    # The KMS integration tests assume an AWS role with this job's OIDC
    # token, so the job may request one.
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      # True only when the role secret reaches this run. A pull request
      # from a fork and a Dependabot run receive no secrets, so it reads
      # false there and the credential step is skipped.
      HAS_AWS_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported
          - elixir: "1.16"
            otp: "26"
          # Middle ground
          - elixir: "1.17"
            otp: "26"
          # Newest Elixir on the oldest supported OTP
          - elixir: "1.18"
            otp: "26"
          # Latest (with coverage upload)
          - elixir: "1.18"
            otp: "27"
            coverage: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-
            deps-${{ runner.os }}-

      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: _build
          key: build-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            build-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Cache PLT
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Cache test vectors
        uses: actions/cache@v4
        with:
          path: test/fixtures/test_vectors
          key: test-vectors-${{ env.TEST_VECTORS_SHA }}

      - name: Setup test vectors
        run: |
          dir=test/fixtures/test_vectors
          if [ "$(git -C "$dir" rev-parse HEAD 2>/dev/null || true)" != "$TEST_VECTORS_SHA" ]; then
            rm -rf "$dir"
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 https://github.com/awslabs/aws-encryption-sdk-test-vectors.git "$TEST_VECTORS_SHA"
            git -C "$dir" checkout -q FETCH_HEAD
            cd "$dir/vectors/awses-decrypt"
            unzip -q python-2.3.0.zip
          fi

      # Assumes the test role on a push, or on a pull request from a
      # branch of this repository, never for Dependabot. The step hands
      # the later steps temporary credentials, session token included.
      # It is a plain STS call rather than an action so that nothing
      # about the role is logged: it selects only the credentials from
      # the response, masks each value before exporting it, discards the
      # CLI's error text and prints a fixed line on a failure.
      - name: Assume the CI role
        id: aws
        if: >-
          env.HAS_AWS_ROLE == 'true' && github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository))
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          resp=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com") \
            || { echo "::error::could not obtain the OIDC token"; exit 1; }
          token=$(jq -r .value <<<"$resp")
          echo "::add-mask::${token}"
          creds=$(aws sts assume-role-with-web-identity \
            --region us-east-1 \
            --role-arn "$ROLE_ARN" --role-session-name ci \
            --web-identity-token "$token" --duration-seconds 3600 \
            --query Credentials --output json 2>/dev/null) \
            || { echo "::error::the role assumption was refused"; exit 1; }
          ak=$(jq -r .AccessKeyId <<<"$creds")
          sk=$(jq -r .SecretAccessKey <<<"$creds")
          st=$(jq -r .SessionToken <<<"$creds")
          echo "::add-mask::${ak}"; echo "::add-mask::${sk}"; echo "::add-mask::${st}"
          {
            echo "AWS_ACCESS_KEY_ID=${ak}"
            echo "AWS_SECRET_ACCESS_KEY=${sk}"
            echo "AWS_SESSION_TOKEN=${st}"
            echo "AWS_REGION=us-east-1"
          } >> "$GITHUB_ENV"

      # KMS_KEY_ARN is set only when the role was assumed. Otherwise it is
      # empty and the integration gate excludes the KMS tests, saying so.
      - name: Run quality checks
        env:
          KMS_KEY_ARN: ${{ steps.aws.outcome == 'success' && secrets.KMS_KEY_ARN || '' }}
        run: mix quality

      - name: Generate coverage report
        if: matrix.coverage
        env:
          KMS_KEY_ARN: ${{ steps.aws.outcome == 'success' && secrets.KMS_KEY_ARN || '' }}
        run: mix coveralls.json

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v4
        with:
          files: cover/excoveralls.json
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  no-aws-deps:
    name: Raw keyrings without AWS deps
    runs-on: ubuntu-latest
    env:
      # Drops the optional ex_aws/ex_aws_kms/hackney/sweet_xml stack from
      # deps entirely, proving the raw-keyring path stands alone. See
      # aws_kms_deps/0 in mix.exs.
      NO_AWS_DEPS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile without AWS deps
        run: mix compile --warnings-as-errors

      - name: Cache test vectors
        uses: actions/cache@v4
        with:
          path: test/fixtures/test_vectors
          key: test-vectors-${{ env.TEST_VECTORS_SHA }}

      - name: Setup test vectors
        run: |
          dir=test/fixtures/test_vectors
          if [ "$(git -C "$dir" rev-parse HEAD 2>/dev/null || true)" != "$TEST_VECTORS_SHA" ]; then
            rm -rf "$dir"
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 https://github.com/awslabs/aws-encryption-sdk-test-vectors.git "$TEST_VECTORS_SHA"
            git -C "$dir" checkout -q FETCH_HEAD
            cd "$dir/vectors/awses-decrypt"
            unzip -q python-2.3.0.zip
          fi

      - name: Run tests without AWS deps
        run: mix test

  hackney-1x:
    name: Host on hackney 1.x (Elixir 1.18 / OTP 26)
    runs-on: ubuntu-latest
    # As in the quality job: the role is assumed with the OIDC token.
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      HAS_AWS_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "26"

      # A host already on hackney 1.x (through httpoison) resolves the
      # SDK with no committed lock, the way a real host would.
      - name: Resolve the hackney 1.x host
        working-directory: test/fixtures/hackney1_host
        run: mix deps.get

      - name: Compile the hackney 1.x host
        working-directory: test/fixtures/hackney1_host
        run: mix compile --warnings-as-errors

      - name: Show the host's resolved hackney and ex_aws
        working-directory: test/fixtures/hackney1_host
        run: grep -E '^  "(hackney|ex_aws)":' mix.lock | cut -d, -f1-3

      # The SDK's own suite on the same pair. Three of hackney's
      # dependencies are locked at versions hackney 1.x refuses, so they
      # are unlocked with it: parse_trans (1.x pins exactly 3.4.1), idna
      # (1.x wants ~> 6.1.0) and certifi (hackney 1.24 and later want
      # ~> 2.15.0, earlier 1.x ~> 2.14.0). The locked mimerl and
      # ssl_verify_fun already satisfy 1.x and stay as locked; packages
      # only 1.x needs are added by deps.get. See aws_kms_deps/0 in
      # mix.exs.
      - name: Unlock the hackney stack
        run: HACKNEY_1X=1 mix deps.unlock hackney ex_aws parse_trans idna certifi

      - name: Install dependencies on hackney 1.x
        run: |
          HACKNEY_1X=1 mix deps.get
          grep -E '^  "(hackney|ex_aws)":' mix.lock | cut -d, -f1-3

      - name: Compile on hackney 1.x
        run: HACKNEY_1X=1 MIX_ENV=test mix compile --warnings-as-errors

      # As in the quality job: the same event gate and the same role.
      - name: Assume the CI role
        id: aws
        if: >-
          env.HAS_AWS_ROLE == 'true' && github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository))
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          resp=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com") \
            || { echo "::error::could not obtain the OIDC token"; exit 1; }
          token=$(jq -r .value <<<"$resp")
          echo "::add-mask::${token}"
          creds=$(aws sts assume-role-with-web-identity \
            --region us-east-1 \
            --role-arn "$ROLE_ARN" --role-session-name ci \
            --web-identity-token "$token" --duration-seconds 3600 \
            --query Credentials --output json 2>/dev/null) \
            || { echo "::error::the role assumption was refused"; exit 1; }
          ak=$(jq -r .AccessKeyId <<<"$creds")
          sk=$(jq -r .SecretAccessKey <<<"$creds")
          st=$(jq -r .SessionToken <<<"$creds")
          echo "::add-mask::${ak}"; echo "::add-mask::${sk}"; echo "::add-mask::${st}"
          {
            echo "AWS_ACCESS_KEY_ID=${ak}"
            echo "AWS_SECRET_ACCESS_KEY=${sk}"
            echo "AWS_SESSION_TOKEN=${st}"
            echo "AWS_REGION=us-east-1"
          } >> "$GITHUB_ENV"

      # KMS integration tests run when the role was assumed; KMS_KEY_ARN
      # is empty otherwise, and the integration gate excludes them and
      # says so in the log.
      - name: Run tests on hackney 1.x
        env:
          KMS_KEY_ARN: ${{ steps.aws.outcome == 'success' && secrets.KMS_KEY_ARN || '' }}
        run: HACKNEY_1X=1 mix test --exclude test_vectors

  kms-floors:
    name: KMS stack at its floors (Elixir 1.18 / OTP 26)
    runs-on: ubuntu-latest
    # As in the quality job: the role is assumed with the OIDC token.
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      HAS_AWS_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "26"

      # The default ranges (ex_aws ~> 2.6, ex_aws_kms ~> 2.5) cannot force
      # their lowest versions, so KMS_FLOORS pins exactly ex_aws 2.6.0
      # and ex_aws_kms 2.5.0. They resolve together on hackney 1.x, so
      # hackney and the dependencies it pins are unlocked with them, as
      # in the hackney 1.x job. See aws_kms_deps/0 in mix.exs.
      - name: Unlock the KMS stack
        run: KMS_FLOORS=1 mix deps.unlock hackney ex_aws ex_aws_kms parse_trans idna certifi

      - name: Install dependencies at the floors
        run: |
          KMS_FLOORS=1 mix deps.get
          grep -E '^  "(hackney|ex_aws|ex_aws_kms)":' mix.lock | cut -d, -f1-3

      - name: Compile at the floors
        run: KMS_FLOORS=1 MIX_ENV=test mix compile --warnings-as-errors

      - name: Cache test vectors
        uses: actions/cache@v4
        with:
          path: test/fixtures/test_vectors
          key: test-vectors-${{ env.TEST_VECTORS_SHA }}

      - name: Setup test vectors
        run: |
          dir=test/fixtures/test_vectors
          if [ "$(git -C "$dir" rev-parse HEAD 2>/dev/null || true)" != "$TEST_VECTORS_SHA" ]; then
            rm -rf "$dir"
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 https://github.com/awslabs/aws-encryption-sdk-test-vectors.git "$TEST_VECTORS_SHA"
            git -C "$dir" checkout -q FETCH_HEAD
            cd "$dir/vectors/awses-decrypt"
            unzip -q python-2.3.0.zip
          fi

      # As in the quality job: the same event gate and the same role.
      - name: Assume the CI role
        id: aws
        if: >-
          env.HAS_AWS_ROLE == 'true' && github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository))
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          resp=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com") \
            || { echo "::error::could not obtain the OIDC token"; exit 1; }
          token=$(jq -r .value <<<"$resp")
          echo "::add-mask::${token}"
          creds=$(aws sts assume-role-with-web-identity \
            --region us-east-1 \
            --role-arn "$ROLE_ARN" --role-session-name ci \
            --web-identity-token "$token" --duration-seconds 3600 \
            --query Credentials --output json 2>/dev/null) \
            || { echo "::error::the role assumption was refused"; exit 1; }
          ak=$(jq -r .AccessKeyId <<<"$creds")
          sk=$(jq -r .SecretAccessKey <<<"$creds")
          st=$(jq -r .SessionToken <<<"$creds")
          echo "::add-mask::${ak}"; echo "::add-mask::${sk}"; echo "::add-mask::${st}"
          {
            echo "AWS_ACCESS_KEY_ID=${ak}"
            echo "AWS_SECRET_ACCESS_KEY=${sk}"
            echo "AWS_SESSION_TOKEN=${st}"
            echo "AWS_REGION=us-east-1"
          } >> "$GITHUB_ENV"

      # KMS integration tests run when the role was assumed; KMS_KEY_ARN
      # is empty otherwise, and the integration gate excludes them and
      # says so in the log.
      - name: Run tests at the floors
        env:
          KMS_KEY_ARN: ${{ steps.aws.outcome == 'success' && secrets.KMS_KEY_ARN || '' }}
        run: KMS_FLOORS=1 mix test
